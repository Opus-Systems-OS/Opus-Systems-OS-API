[package]
name = "opus-api"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Opus Systems OS API — the front door to the fleet, inference and clients"

[lib]
name = "opus_api"
path = "src/lib.rs"

[[bin]]
name = "opus-api"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["macros", "ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["trace", "cors"] }
http = "1"
reqwest = { version = "0.13", features = ["json", "query", "stream"] }
http-body-util = "0.1"
futures-util = "0.3"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
thiserror = "2"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
sha2 = "0.10"
subtle = "2"
getrandom = "0.3"
time = { version = "0.3", features = ["formatting", "parsing"] }
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-axum = "0.2"
utoipa-redoc = { version = "6", features = ["axum"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tokio-tungstenite = "0.30"
